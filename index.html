careerProgressionHTML = function(cp){
  if(!cp) return '<div class="dx-card" style="margin-top:16px"><p class="muted">Data Career Progression belum tersedia.</p></div>';

  const c = cp.components || {}, w = c.weights || {};
  const hasW = Object.keys(w).length > 0;
  const ST = {
    ELIGIBLE:['Layak naik level','#137a43','#ecfdf3','✅'],
    NOT_YET_ELIGIBLE:['Belum layak','#334155','#f2f4f7','⏳'],
    BLOCKED_BY_GATE:['Tertahan mandatory gate','#9a3412','#fff7ed','⛔'],
    INCOMPLETE:['Data belum lengkap','#991b1b','#fef2f2','📝'],
    HIGHEST_LEVEL:['Level tertinggi (T4)','#137a43','#ecfdf3','🏆']
  };
  const S = ST[cp.status] || [cp.status || '-', '#334155', '#f2f4f7', 'ℹ️'];
  const score = (cp.score === null || cp.score === undefined) ? null : Number(cp.score);
  const th = (cp.threshold === null || cp.threshold === undefined) ? null : Number(cp.threshold);

  const ring = (typeof dxRing_ === 'function')
    ? dxRing_(score === null ? 0 : Math.round(score), S[1], 'Skor Progression',
        th === null ? '' : 'Threshold ' + th, score === null ? '-' : score.toFixed(1))
    : '';

  const track = (score !== null || th !== null) ? `
    <div class="cpx-track">
      <div class="cpx-fill" style="width:${score === null ? 0 : Math.max(0, Math.min(100, score))}%"></div>
      ${th !== null ? `<div class="cpx-th" style="left:${Math.min(100, th)}%"><span>Threshold ${th}</span></div>` : ''}
    </div>
    <div class="small muted">${score === null ? 'Skor total belum dapat dihitung sampai semua data lengkap.' :
      (th !== null && score >= th ? 'Skor sudah mencapai threshold.' : (th !== null ? 'Kurang ' + (th - score).toFixed(1) + ' poin dari threshold.' : ''))}</div>` : '';

  const comps = [
    ['Competency', c.competency, w.competency, '#2563eb'],
    ['Supervisor Readiness', c.supervisor, w.supervisor, '#7c3aed'],
    ['KPI / Performance', c.kpi, w.kpi, '#ea580c'],
    ['Experience & Contribution', c.experienceContribution, w.experience, '#0d9488']
  ].filter(x => !hasW || Number(x[2]) > 0);

  const compHTML = comps.map(x => {
    const v = (x[1] === null || x[1] === undefined || isNaN(Number(x[1]))) ? null : Number(x[1]);
    const pts = v === null ? null : v * Number(x[2] || 0) / 100;
    return `<div class="cpx-comp">
      <div><b>${esc(x[0])}</b><div class="small muted">Bobot ${Number(x[2] || 0)}%</div></div>
      <div class="cpx-bar"><i style="width:${v === null ? 0 : Math.min(100, v)}%;background:${x[3]}"></i></div>
      <div style="text-align:right"><b>${cpxF_(v)}</b><div class="small muted">${pts === null ? '-' : '+' + pts.toFixed(1) + ' poin'}</div></div>
    </div>`;
  }).join('') || '<p class="muted small">Belum ada komponen.</p>';

  const A = c.assessment || {};
  const showAssess = A.totalCompetencies && !(c.active && c.active.competency === false);
  const pctOf = x => A.totalCompetencies ? Math.round((x || 0) / A.totalCompetencies * 100) : 0;
  const assessHTML = showAssess ? `
    <div class="cpx-sub">Kelengkapan Penilaian Kompetensi</div>
    <div class="cpx-comp"><div><b>Self Assessment</b></div>
      <div class="cpx-bar"><i style="width:${pctOf(A.selfCompleted)}%;background:#0d9488"></i></div>
      <div style="text-align:right"><b>${A.selfCompleted || 0}/${A.totalCompetencies}</b></div></div>
    <div class="cpx-comp"><div><b>Supervisor Assessment</b></div>
      <div class="cpx-bar"><i style="width:${pctOf(A.supervisorCompleted)}%;background:#7c3aed"></i></div>
      <div style="text-align:right"><b>${A.supervisorCompleted || 0}/${A.totalCompetencies}</b></div></div>` : '';

  const gates = (cp.gates || []).map(g => {
    const isKpi = g.code === 'KPI';
    const act = (g.actual === null || g.actual === undefined || isNaN(Number(g.actual))) ? '-'
      : (isKpi ? Number(g.actual).toFixed(0) + '%' : 'L' + g.actual);
    const ok = !g.required || g.passed;
    const label = !g.required ? 'Tidak wajib' : (g.passed ? 'Lulus' : 'Belum terpenuhi');
    return `<div class="cpx-gate ${ok ? 'ok' : 'no'}">
      <div style="display:flex;justify-content:space-between;gap:6px"><b class="small">${esc(g.name || g.code)}</b><span style="font-size:18px">${ok ? '✅' : '❌'}</span></div>
      <div class="small muted" style="margin-top:6px">Minimum <b>${esc(g.minimum || '-')}</b> • Saat ini <b>${act}</b></div>
      <div class="small" style="margin-top:4px;font-weight:700;color:${ok ? '#137a43' : '#b42318'}">${label}</div>
    </div>`;
  }).join('');

  const reasons = (cp.reasons || []).map(r => `<li>${esc(r)}</li>`).join('');

  return `
  <div class="dx-card" style="margin-top:16px;border-left:5px solid ${S[1]}">
    <div class="cpx-title">🏁 Career Progression</div>
    <p class="small muted" style="margin:0">Kesiapan naik level berdasarkan kompetensi, readiness supervisor, KPI, pengalaman, dan mandatory gate.</p>

    <div class="cpx-top">
      <div class="cpx-ringbox">${ring}</div>
      <div class="cpx-main">
        <div>
          <span class="cpx-chip">${esc(cp.currentLevel || '-')} → ${esc(cp.nextLevel || '—')}</span>
          ${cp.academicYear ? `<span class="cpx-chip">${esc(cp.academicYear)}</span>` : ''}
        </div>
        <div class="cpx-banner" style="background:${S[2]};color:${S[1]}">${S[3]} ${esc(S[0])}
          <div class="small" style="font-weight:400;margin-top:2px">${esc(cp.recommendation || '')}</div></div>
        ${track}
      </div>
    </div>

    <div class="cpx-sub">Komponen Skor</div>
    ${compHTML}
    ${assessHTML}

    ${gates ? `<div class="cpx-sub">Mandatory Gates</div><div class="cpx-gates">${gates}</div>` : ''}

    ${reasons ? `<div class="cpx-need"><b>Langkah berikutnya</b><ul style="margin:6px 0 0">${reasons}</ul></div>`
      : (cp.status === 'ELIGIBLE' || cp.status === 'HIGHEST_LEVEL'
          ? '<div class="cpx-need" style="background:#f0fdf4;border-color:#16a34a;color:#166534"><b>Semua persyaratan terpenuhi.</b></div>' : '')}
  </div>`;
};

/* Hasil Evaluate di halaman admin memakai tampilan yang sama */
renderCareerProgressionResult = function(r){
  const box = document.getElementById('careerProgressionResult');
  if(!box) return;
  const nm = (r && r.teacher && r.teacher.name)
    ? `<div class="small muted" style="margin-top:14px">Evaluasi untuk: <b>${esc(r.teacher.name)}</b></div>` : '';
  box.innerHTML = nm + careerProgressionHTML(r);
};


</script>
</body>
</html>
