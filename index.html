<style>
:root{--navy:#17324d;--blue:#2563eb;--bg:#f5f7fb;--line:#e5e7eb;--green:#16834b;--orange:#c56b08}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:20px;margin:0}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}
.login{max-width:430px;margin:70px auto}.login h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:8px}.btn{border:0;border-radius:8px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#1d4ed8}.btn.danger{background:#b42318}.muted{color:#667085}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:10px}.stat b{font-size:25px;display:block}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff}.tab.active{background:#17324d;color:#fff}.comp{border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:17px}.comp h3{margin:0 0 5px;font-size:16px}.levelgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.level{border:1px solid #d9dee8;border-radius:9px;padding:11px;background:#fff}.level.selected{border:2px solid var(--blue);background:#eef4ff}.level strong{display:block}.small{font-size:12px}.bar{height:10px;background:#e9edf3;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue)}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;color:#1d4ed8;font-weight:700;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.error{background:#fff0f0;color:#a61b1b;padding:10px;border-radius:8px;margin:10px 0}.success{background:#ecfdf3;color:#137a43;padding:10px;border-radius:8px;margin:10px 0}
@media(max-width:800px){.grid,.levelgrid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:12px}.top button{margin-top:3px}}

.tgd-hero{background:linear-gradient(135deg,#17324d,#2563eb);color:#fff;border-radius:14px;padding:26px;margin-bottom:16px}.tgd-hero h1{margin:0 0 8px;font-size:28px}.tgd-slide{min-height:150px;display:flex;flex-direction:column;justify-content:center}.tgd-slide h2{margin:0 0 6px}.tgd-slide .body{white-space:pre-line;line-height:1.6}.tgd-dots{display:flex;gap:6px;margin-top:14px}.tgd-dot{width:8px;height:8px;border-radius:50%;background:#b9c7dc}.tgd-dot.active{background:#fff}.level-path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.level-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.level-card.current{border:2px solid var(--blue);background:#eef4ff}.level-card h3{margin:0 0 5px}.content-edit{display:grid;grid-template-columns:90px minmax(0,1fr) 180px;gap:16px;align-items:start}.content-edit label{display:block;font-weight:700;font-size:12px;margin:0 0 5px;color:#344054}.content-edit input[type=text],.content-edit input[type=number],.content-edit textarea{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #ccd3df;border-radius:8px;background:#fff}.content-edit textarea{min-height:150px;resize:vertical;line-height:1.45}.content-edit .content-main{display:grid;gap:10px}.content-edit .content-settings{display:grid;gap:10px}.content-edit .content-settings .check-row{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.content-edit .content-settings .check-row input{width:auto}.content-edit .content-note{margin:0}.content-edit .content-type{padding-top:4px}.content-edit .content-type .badge{white-space:nowrap}.content-edit .content-order{width:100%}.content-edit .content-body{min-height:170px}.tgd-intro-card{background:#f8fbff;border:1px solid #d9e5f5;border-radius:14px;padding:22px;margin-bottom:16px}.tgd-intro-card h2{margin:0 0 8px}.tgd-intro-card .body{white-space:pre-line;line-height:1.6}.tgd-intro-sub{margin:0 0 10px}.tgd-section-title{margin:18px 0 10px}.tgd-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.tgd-row-actions{display:flex;gap:6px;flex-wrap:wrap}.tgd-editor-card{margin-bottom:12px}@media(max-width:900px){.content-edit{grid-template-columns:80px 1fr}.content-edit .content-settings{grid-column:2}.content-edit .content-body{min-height:150px}}@media(max-width:700px){.grid,.level-path,.content-edit{grid-template-columns:1fr}.content-edit .content-settings{grid-column:auto}.levelgrid{grid-template-columns:1fr 1fr}}

/* TGD UI TEST */
.card{
  box-shadow:0 4px 14px rgba(23,50,77,.06);
  border-radius:16px;
}

/* =========================================================
   TGD CAREER PROGRESSION POLISH v1
   HANYA TAMPILAN
   ========================================================= */

#careerProgressionPanel{
  padding:26px;
}

/* Judul */
#careerProgressionPanel > h2{
  font-size:23px;
  color:#17324d;
  letter-spacing:-.2px;
  margin-bottom:6px;
}

/* Deskripsi */
#careerProgressionPanel > .muted{
  font-size:13px;
  line-height:1.6;
  margin-bottom:18px;
}

/* Kartu Current / Next / Score / Threshold */
#careerProgressionPanel .grid .stat{
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(180deg,#ffffff 0%,#f9fbfe 100%);
}

#careerProgressionPanel .grid .stat span{
  margin-bottom:7px;
}

#careerProgressionPanel .grid .stat b{
  font-size:24px !important;
  color:#17324d;
}

/* Score dibuat lebih menonjol */
#careerProgressionPanel .grid .stat:nth-child(3){
  background:#f5f8ff;
  border-color:#d8e3ff;
}

#careerProgressionPanel .grid .stat:nth-child(3) b{
  color:#2563eb;
}

/* Threshold */
#careerProgressionPanel .grid .stat:nth-child(4){
  background:#fafafa;
}

/* Judul bagian */
#careerProgressionPanel h3{
  margin-top:25px;
  margin-bottom:12px;
  font-size:16px;
  color:#17324d;
  padding-bottom:7px;
  border-bottom:1px solid #edf0f4;
}

/* Tabel Career Progression */
#careerProgressionPanel .table{
  border:1px solid #e5eaf1;
  border-radius:12px;
  overflow:hidden;
}

#careerProgressionPanel .table th{
  background:#f6f8fb;
  color:#475467;
  font-size:11px;
  font-weight:700;
}

#careerProgressionPanel .table td{
  font-size:13px;
  color:#344054;
}

#careerProgressionPanel .table td:nth-child(2){
  font-weight:700;
}

/* Area yang perlu dipenuhi */
#careerProgressionPanel ul{
  margin:8px 0 0 0;
  padding-left:20px;
}

#careerProgressionPanel li{
  margin:7px 0;
  line-height:1.5;
}

/* Sedikit lebih nyaman di HP */
@media(max-width:600px){

  #careerProgressionPanel{
    padding:18px;
  }

  #careerProgressionPanel > h2{
    font-size:20px;
  }

  #careerProgressionPanel .grid .stat{
    min-height:82px;
  }

  #careerProgressionPanel .grid .stat b{
    font-size:22px !important;
  }
}

.stat{
  border-radius:14px;
}

</style>
</head>
<body>
<div id="app"></div>
<script>
let TOKEN=localStorage.getItem('tg_token')||'';
let ME=null, COMPS=[], DATA=null;
let MAPPING_VIEW_ID=0;

function call(fn,...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args)
  });
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function err(e){document.querySelectorAll('.error').forEach(x=>x.remove());let d=document.createElement('div');d.className='error';d.textContent=e.message||e;document.querySelector('.wrap')?.prepend(d)}
function loginView(){
document.getElementById('app').innerHTML=`<div class="wrap"><div class="card login">
<h2>Teacher Growth & Development</h2><p class="muted">Self-Reflection & Professional Development</p>
<div class="field"><label>Username</label><input id="user"></div>
<div class="field"><label>Password</label><input id="pass" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
<button class="btn" onclick="doLogin()">Login</button>
<p class="small muted" style="margin-top:18px">Gunakan username dan password yang diberikan oleh Admin.</p>
</div></div>`;
}
async function doLogin(){try{let r=await call('login',document.getElementById('user').value,document.getElementById('pass').value);TOKEN=r.token;ME=r.user;localStorage.setItem('tg_token',TOKEN);await boot()}catch(e){err(e)}}
function hasRole(role){return String(ME&&ME.role||'').toUpperCase().split(/[,;+|]/).map(x=>x.trim()).includes(role)||String(ME&&ME.role||'').toUpperCase()==='ADMIN'}
async function boot(){try{ME=await call('getSession',TOKEN);COMPS=hasRole('TEACHER')?await call('getAssessmentCompetencies',TOKEN):await call('getCompetencies',TOKEN);render()}catch(e){localStorage.removeItem('tg_token');TOKEN='';loginView()}}
function shell(body){
return `<div class="top"><h1>Teacher Growth & Development</h1><button class="btn secondary" onclick="doLogout()">Logout</button></div><div class="wrap">${body}</div>`
}
async function render(){
let menu='';
if(hasRole('ADMIN')) menu=`<div class="tabs" id="adminNav"><button class="tab active" data-page="dashboard" onclick="showAdmin()">School Dashboard</button><button class="tab" data-page="mapping" onclick="showMapping()">Career Mapping</button><button class="tab" data-page="competencies" onclick="showCompetencies()">Manage Competencies</button><button class="tab" data-page="users" onclick="showUsers()">Manage Users</button><button class="tab" data-page="content" onclick="showTGDContentAdmin()">Manage TGD Content</button><button class="tab" data-page="career-policy" onclick="showCareerPolicy()">Career Progression Policy</button><button class="tab" data-page="career-inputs" onclick="showCareerProgressionInputs()">Career Progression Inputs</button><button class="tab" data-page="readiness" onclick="showReadinessAdmin()">Supervisor Readiness</button><button class="tab" data-page="experience-contribution" onclick="showExperienceContributionAdmin()">Experience & Contribution</button><button class="tab" data-page="experience-assessment" onclick="showExperienceContributionAssessment()">Experience & Contribution Assessment</button></div><div id="page"></div>`;
else {
  let tabs=[];
  if(hasRole('TEACHER')) tabs.push(`<button class="tab active" data-page="teacher-dashboard" onclick="showTeacherDashboard()">Dashboard</button><button class="tab" data-page="self" onclick="showSelf()">Self-Reflection</button><button class="tab" data-page="training" onclick="showTraining()">Training & IDP</button>`);
  if(hasRole('SUPERVISOR')) tabs.push(`<button class="tab" data-page="supervisor" onclick="showSupervisor()">My Teachers / Supervisor</button>`);
  menu=`<div class="tabs" id="teacherNav">${tabs.join('')}</div><div id="page"></div>`;
}
document.getElementById('app').innerHTML=shell(`<div class="card"><b>${esc(ME.name)}</b> <span class="badge">${esc(ME.role).replace(',', ' + ')}</span><div class="muted small">${esc(ME.department||'')} ${ME.subject?'• '+esc(ME.subject):''} ${ME.careerLevel?'• '+esc(ME.careerLevel):''}</div></div>`+menu);
if(hasRole('ADMIN')) showAdmin(); else if(hasRole('TEACHER')) showTeacherDashboard(); else showSupervisor();
}
async function doLogout(){await call('logout',TOKEN);localStorage.removeItem('tg_token');TOKEN='';loginView()}
function setAdminActive(page){
  document.querySelectorAll('#adminNav .tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
}
function setTeacherActive(page){
  document.querySelectorAll('#teacherNav .tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
}
function dashboardHTML(d){

  const items = (d.items || []).slice().sort((a,b) =>
    String(a.code).localeCompare(String(b.code))
  );

  const top = (d.topGaps || []).map(i => `
    <tr>
      <td>${esc(i.code)}</td>
      <td>${esc(i.name)}</td>
      <td>${i.target}</td>
      <td>${i.selfLevel || '-'}</td>
      <td>${i.supLevel || '-'}</td>
      <td>${i.validatedLevel || '-'}</td>
      <td>${i.developmentGap}</td>
      <td>${i.priority}</td>
    </tr>
  `).join('');

  const allAssessment = items.map(i => {

    const hasSupervisor = Number(i.supLevel || 0) > 0;

    let status = hasSupervisor
      ? 'VALIDATED'
      : (Number(i.selfLevel || 0) > 0 ? 'PROVISIONAL' : 'NOT ASSESSED');

    return `
      <tr>
        <td>${esc(i.code)}</td>
        <td>${esc(i.name)}</td>
        <td>${esc(i.cluster || '')}</td>
        <td>${i.target || '-'}</td>
        <td>${i.selfLevel || '-'}</td>
        <td>${i.supLevel || '-'}</td>
        <td>${i.validatedLevel || '-'}</td>
        <td>${i.developmentGap}</td>
        <td>${i.reflectionGap || 0}</td>
        <td>${i.priority}</td>
        <td>${status}</td>
      </tr>
    `;
  }).join('');

  const selfCount = items.filter(i => Number(i.selfLevel || 0) > 0).length;
  const supervisorCount = items.filter(i => Number(i.supLevel || 0) > 0).length;
  const validatedCount = items.filter(i => Number(i.validatedLevel || 0) > 0).length;

  const strengths = (d.strengths || []).map(i =>
    `<li>${esc(i.name)} — Level ${i.validatedLevel} (target ${i.target})</li>`
  ).join('');

  return `
    <div id="tgdSlides">
      ${tgdSlideshowHTML()}
    </div>

    ${levelingHTML(d.teacher.careerLevel)}

    <div class="grid">

      <div class="stat">
        <span>Profile</span>
        <b style="font-size:18px">${esc(d.profile)}</b>
      </div>

      <div class="stat">
        <span>Career</span>
        <b style="font-size:18px">${esc(d.teacher.careerLevel)}</b>
      </div>

      <div class="stat">
        <span>Competencies</span>
        <b>${items.length}</b>
      </div>

      <div class="stat">
        <span>Growth Areas</span>
        <b>${(d.topGaps || []).length}</b>
      </div>

    </div>


    <div class="card">

      <h2>Your Development Profile</h2>

      <p class="muted">
        Hasil ini digunakan untuk membantu percakapan pengembangan, bukan KPI.
      </p>

      <p class="small muted">
        <b>${items.length}</b>
        kompetensi dipetakan untuk Career
        ${esc(d.teacher.careerLevel)}.
      </p>

      <p class="small muted">
        <b>Status:</b>
        ${
          supervisorCount === items.length
          ? 'Validated oleh Supervisor'
          : 'Provisional — sebagian/belum divalidasi Supervisor'
        }
      </p>


      <div class="grid">

        <div class="stat">
          <span>Self Assessment</span>
          <b>${selfCount}/${items.length}</b>
        </div>

        <div class="stat">
          <span>Supervisor Assessment</span>
          <b>${supervisorCount}/${items.length}</b>
        </div>

        <div class="stat">
          <span>Validated</span>
          <b>${validatedCount}/${items.length}</b>
        </div>

        <div class="stat">
          <span>Priority Areas</span>
          <b>${(d.topGaps || []).length}</b>
        </div>

      </div>


      <h3>Strengths</h3>

      <ul>
        ${
          strengths ||
          '<li>Belum ada strength yang teridentifikasi.</li>'
        }
      </ul>


      <h3>Priority Growth Areas</h3>

      <p class="small muted">
        Lima kompetensi dengan prioritas pengembangan tertinggi.
      </p>

      <table class="table">

        <tr>
          <th>Code</th>
          <th>Competency</th>
          <th>Target</th>
          <th>Self</th>
          <th>Supervisor</th>
          <th>Validated</th>
          <th>Gap</th>
          <th>Priority</th>
        </tr>

        ${
          top ||
          '<tr><td colspan="8">Belum ada gap teridentifikasi.</td></tr>'
        }

      </table>


      <h3 style="margin-top:28px;">
        Complete Assessment — 19 Competencies
      </h3>

      <p class="small muted">
        Tabel berikut menampilkan seluruh kompetensi yang dipetakan,
        termasuk hasil Self Assessment dan Supervisor Assessment.
      </p>

      <div style="overflow-x:auto;">

        <table class="table">

          <tr>
            <th>Code</th>
            <th>Competency</th>
            <th>Cluster</th>
            <th>Target</th>
            <th>Self</th>
            <th>Supervisor</th>
            <th>Validated</th>
            <th>Gap</th>
            <th>Reflection Gap</th>
            <th>Priority</th>
            <th>Status</th>
          </tr>

          ${
            allAssessment ||
            '<tr><td colspan="11">Belum ada data assessment.</td></tr>'
          }

        </table>

      </div>

    </div>
  `;
}

async function showSelf(){

  setTeacherActive('self');

  document.getElementById('page').innerHTML = `
    <div class="card">
      <h2>Self-Reflection</h2>

      <p class="muted">
        Pilih level yang paling menggambarkan kondisi Anda saat ini.
        Gunakan bukti praktik untuk mendukung penilaian Anda.
      </p>

      <div id="assessmentStatus" class="small muted">
        Memuat hasil assessment...
      </div>

      <div id="selfForm"></div>

      <button class="btn" onclick="submitSelf()">
        Submit Reflection
      </button>
    </div>
  `;

  try {

    const detail = await call(
      'getMyAssessmentDetail',
      TOKEN
    );

    document.getElementById('assessmentStatus').innerHTML =
      '✓ Data Self-Reflection dan Supervisor Assessment berhasil dimuat.';

    let f = document.getElementById('selfForm');

    f.innerHTML = detail.map((c,i) =>
      compForm(c,i,'self')
    ).join('');

  } catch(e) {

    document.getElementById('assessmentStatus').innerHTML =
      '<span style="color:#b91c1c">Gagal memuat data assessment.</span>';

    err(e);
  }
}

function compForm(c,i,type){

  const isSupervisor = type === 'sup';

  const selfData = c.self || {};
  const supData  = c.supervisor || {};

  const selfLevel = Number(selfData.level || 0);
  const supLevel  = Number(supData.level || 0);

  const selectedLevel =
    isSupervisor ? supLevel : selfLevel;

  const levelNames = [
    'Dasar',
    'Berkembang',
    'Mahir',
    'Ahli/Mentor'
  ];

  /*
   * =========================================================
   * DATA SUPERVISOR LAMA
   * =========================================================
   */

  const previousSupervisorHTML =
    isSupervisor && supLevel
    ? `
      <div
        class="card"
        style="
          margin-top:14px;
          background:#f0fdf4;
          border-left:4px solid #16a34a;
        "
      >

        <h4 style="margin:0 0 8px;">
          Assessment Supervisor Sebelumnya
        </h4>

        <p style="margin:4px 0;">
          <b>
            Level ${supLevel} — ${levelNames[supLevel-1]}
          </b>
        </p>

        ${
          supData.supervisor
          ? `
            <div class="small muted" style="margin-top:6px;">
              Supervisor: ${esc(supData.supervisor)}
            </div>
          `
          : ''
        }

        ${
          supData.evidence
          ? `
            <div class="field" style="margin-top:10px;">
              <label>
                Bukti / Contoh Praktik Sebelumnya
              </label>

              <div
                class="small"
                style="
                  padding:10px;
                  background:white;
                  border-radius:8px;
                  white-space:pre-line;
                "
              >
                ${esc(supData.evidence)}
              </div>
            </div>
          `
          : ''
        }

        ${
          supData.comment
          ? `
            <div class="field" style="margin-top:10px;">
              <label>
                Komentar Supervisor Sebelumnya
              </label>

              <div
                class="small"
                style="
                  padding:10px;
                  background:white;
                  border-radius:8px;
                  white-space:pre-line;
                "
              >
                ${esc(supData.comment)}
              </div>
            </div>
          `
          : ''
        }

      </div>
    `
    : '';


  /*
   * =========================================================
   * HASIL SUPERVISOR DI HALAMAN SELF-REFLECTION
   * =========================================================
   */

  const supervisorResult =
    !isSupervisor
    ? (
        supLevel
        ? `
          <div
            class="card"
            style="
              margin-top:14px;
              background:#f0fdf4;
              border-left:4px solid #16a34a;
            "
          >

            <h4 style="margin:0 0 8px;">
              Supervisor Assessment
            </h4>

            <p style="margin:4px 0;">
              <b>
                Level ${supLevel} — ${levelNames[supLevel-1]}
              </b>
            </p>

            ${
              supData.supervisor
              ? `
                <p class="small muted">
                  Supervisor:
                  ${esc(supData.supervisor)}
                </p>
              `
              : ''
            }

            ${
              supData.evidence
              ? `
                <div class="field">
                  <label>
                    Bukti / Contoh Praktik dari Supervisor
                  </label>

                  <div
                    class="small"
                    style="
                      padding:10px;
                      background:white;
                      border-radius:8px;
                      white-space:pre-line;
                    "
                  >
                    ${esc(supData.evidence)}
                  </div>
                </div>
              `
              : ''
            }

            ${
              supData.comment
              ? `
                <div class="field">
                  <label>
                    Komentar Supervisor
                  </label>

                  <div
                    class="small"
                    style="
                      padding:10px;
                      background:white;
                      border-radius:8px;
                      white-space:pre-line;
                    "
                  >
                    ${esc(supData.comment)}
                  </div>
                </div>
              `
              : ''
            }

          </div>
        `
        : `
          <div
            class="card"
            style="
              margin-top:14px;
              background:#fff7ed;
              border-left:4px solid #f97316;
            "
          >

            <b>Supervisor Assessment</b>

            <p class="small muted">
              Supervisor belum melakukan assessment

let TGD_CONTENT=[]; let TGD_TIMER=null; let TGD_INDEX=0;
function activeContent(){return TGD_CONTENT.filter(x=>x.active).sort((a,b)=>a.sortOrder-b.sortOrder)}
function tgdIntro(){return activeContent().find(x=>x.type==='INTRO')||null}
function tgdSlides(){return activeContent().filter(x=>x.type==='SLIDE').sort((a,b)=>a.sortOrder-b.sortOrder)}
function tgdSlideshowHTML(){
  const intro=tgdIntro();
  const slides=tgdSlides();
  const introHtml=intro?`<div class="tgd-intro-card"><div class="small">Teacher Growth & Development</div><h2>${esc(intro.title)}</h2><p class="tgd-intro-sub"><b>${esc(intro.subtitle)}</b></p><div class="body">${esc(intro.body)}</div></div>`:'';
  if(!slides.length)return introHtml;
  const x=slides[TGD_INDEX%slides.length];
  const dots=slides.map((s,i)=>`<span class="tgd-dot ${i===(TGD_INDEX%slides.length)?'active':''}"></span>`).join('');
  return `${introHtml}<div class="tgd-hero"><div class="tgd-slide"><div class="small">Teacher Growth & Development</div><h2>${esc(x.title)}</h2><p><b>${esc(x.subtitle)}</b></p><div class="body">${esc(x.body)}</div></div><div class="tgd-dots">${dots}</div><div style="margin-top:12px"><button class="btn secondary" onclick="tgdPrev()">‹ Previous</button> <button class="btn secondary" onclick="tgdNext()">Next ›</button></div></div>`;
}
function tgdStart(){if(TGD_TIMER)clearInterval(TGD_TIMER);TGD_TIMER=setInterval(()=>{const slides=tgdSlides();if(slides.length>1){TGD_INDEX=(TGD_INDEX+1)%slides.length;const el=document.getElementById('tgdSlides');if(el)el.innerHTML=tgdSlideshowHTML();}},7000)}
function tgdPrev(){const slides=tgdSlides();if(!slides.length)return;TGD_INDEX=(TGD_INDEX-1+slides.length)%slides.length;document.getElementById('tgdSlides').innerHTML=tgdSlideshowHTML()}
function tgdNext(){const slides=tgdSlides();if(!slides.length)return;TGD_INDEX=(TGD_INDEX+1)%slides.length;document.getElementById('tgdSlides').innerHTML=tgdSlideshowHTML()}
function levelingHTML(level){const lv=activeContent().filter(x=>x.type==='LEVEL').sort((a,b)=>a.sortOrder-b.sortOrder);return `<div class="card"><h2>📈 Career Leveling</h2><p class="muted">Level menggambarkan tahap perkembangan profesional, bukan label nilai pribadi.</p><div class="level-path">${lv.map(x=>`<div class="level-card ${x.key===level?'current':''}"><h3>${esc(x.title)}</h3><p class="small">${esc(x.body)}</p>${x.key===level?'<span class="badge">YOUR CURRENT LEVEL</span>':''}</div>`).join('')}</div></div>`}

  const field=(x,kind)=>`<div class="comp tgd-editor-card" data-tgd-key="${esc(x.key)}" data-tgd-type="${esc(x.type)}">

        <div><label>Body</label><textarea class="content-body" data-field="body">${esc(x.body)}</textarea></div>
      </div>
      <div class="content-settings">
        <div><label>Urutan</label><input class="content-order" type="number" data-field="order" value="${x.sortOrder}"></div>
        <label class="check-row"><input type="checkbox" data-field="active" ${x.active?'checked':''}> Aktif</label>
        <p class="small muted content-note">${x.type==='LEVEL'?'Ditampilkan pada Career Leveling.':x.type==='INTRO'?'Halaman pembuka, bukan bagian slideshow.':'Ditampilkan pada slideshow Dashboard.'}</p>
        ${kind==='slide'?`<div class="tgd-row-actions"><button type="button" class="btn secondary" onclick="moveTGDSlide('${esc(x.key)}',-1)">↑</button><button type="button" class="btn secondary" onclick="moveTGDSlide('${esc(x.key)}',1)">↓</button><button type="button" class="btn secondary" onclick="deactivateTGDSlide('${esc(x.key)}')">Nonaktifkan</button></div>`:''}
      </div>
    </div>
  </div>`;
  document.getElementById('page').innerHTML=`<div class="card"><h2>Manage TGD Content</h2><p class="muted">Admin dapat mengubah introduction, menambah/mengurangi slide, mengatur urutan, dan mengubah deskripsi career leveling. INTRO selalu terpisah dari slideshow.</p>
    <h3 class="tgd-section-title">Introduction</h3>${intro?field(intro,'intro'):'<div class="error">Konten INTRO belum tersedia.</div>'}
    <div class="tgd-section-head"><h3 class="tgd-section-title">Slideshow <span class="badge">${slides.filter(x=>x.active).length} aktif</span></h3><button class="btn" onclick="addTGDSlide()">+ Tambah Slide</button></div>
    <div id="tgdSlideEditor">${slides.length?slides.map(x=>field(x,'slide')).join(''):'<div class="muted">Belum ada slide aktif. Klik Tambah Slide.</div>'}</div>
    <h3 class="tgd-section-title">Career Leveling</h3>${levels.map(x=>field(x,'level')).join('')}
    <button class="btn" onclick="saveTGDContentAdmin()">Save TGD Content</button>
  </div>`;
}
function addTGDSlide(){
  const n=TGD_CONTENT.filter(x=>x.type==='SLIDE').length+1;
  const key='slide_'+Date.now();
  TGD_CONTENT.push({key,type:'SLIDE',title:'New TGD Slide '+n,subtitle:'Subtitle',body:'Tulis isi slide di sini.',sortOrder:n,active:true});
  renderTGDContentAdmin();
  setTimeout(()=>document.querySelector(`[data-tgd-key="${key}"] input[data-field="title"]`)?.focus(),50);
}
function deactivateTGDSlide(key){const x=TGD_CONTENT.find(x=>x.key===key);if(x)x.active=false;renderTGDContentAdmin()}
function moveTGDSlide(key,dir){
  const slides=TGD_CONTENT.filter(x=>x.type==='SLIDE').sort((a,b)=>a.sortOrder-b.sortOrder);
  const idx=slides.findIndex(x=>x.key===key), ni=idx+dir;
  if(idx<0||ni<0||ni>=slides.length)return;
  const tmp=slides[idx].sortOrder;slides[idx].sortOrder=slides[ni].sortOrder;slides[ni].sortOrder=tmp;
  renderTGDContentAdmin();
}
function collectTGDEditor(){
  document.querySelectorAll('[data-tgd-key]').forEach(card=>{
    const key=card.dataset.tgdKey, x=TGD_CONTENT.find(v=>String(v.key)===String(key));
    if(!x)return;
    x.title=card.querySelector('[data-field="title"]').value;
    x.subtitle=card.querySelector('[data-field="subtitle"]').value;
    x.body=card.querySelector('[data-field="body"]').value;
    x.sortOrder=Number(card.querySelector('[data-field="order"]').value||0);
    x.active=card.querySelector('[data-field="active"]').checked;
  });
}
async function saveTGDContentAdmin(){
  try{
    collectTGDEditor();
    const intro=TGD_CONTENT.find(x=>x.type==='INTRO');
    if(intro){intro.sortOrder=0;}
    TGD_CONTENT.filter(x=>x.type==='SLIDE').sort((a,b)=>a.sortOrder-b.sortOrder).forEach((x,i)=>x.sortOrder=i+1);
    TGD_CONTENT.filter(x=>x.type==='LEVEL').sort((a,b)=>a.sortOrder-b.sortOrder).forEach((x,i)=>x.sortOrder=i+1);
    const items=TGD_CONTENT.map(x=>({type:x.type,key:x.key,title:x.title,subtitle:x.subtitle,body:x.body,active:!!x.active,sortOrder:Number(x.sortOrder||0)}));
    TGD_CONTENT=await call('tgdAdminSave_v263',TOKEN,items);
    alert('Konten TGD berhasil diperbarui.');
    renderTGDContentAdmin();
  }catch(e){err(e)}
}

function normalizeCareerGateMinimum(code,value){
  const c=String(code||'').trim().toUpperCase();
  const v=String(value??'').trim();
  if(c==='KPI'){
    if(v==='') return '';
    const n=Number(v.replace('%',''));
    if(Number.isFinite(n)){
      const pct=v.includes('%')?n:(n<=1?n*100:n);
      return String(Math.round(pct*100)/100)+'%';
    }
  }
  return v;
}

function careerPolicyGateRow(g,i){
  return `<tr><td><input id="cp_g_code_${i}" value="${esc(g.code||'')}" ${i<3?'readonly':''}></td><td><input id="cp_g_name_${i}" value="${esc(g.name||'')}"></td><td style="text-align:center"><input type="checkbox" id="cp_g_t12_${i}" ${g.T1_T2?'checked':''}></td><td style="text-align:center"><input type="checkbox" id="cp_g_t23_${i}" ${g.T2_T3?'checked':''}></td><td style="text-align:center"><input type="checkbox" id="cp_g_t34_${i}" ${g.T3_T4?'checked':''}></td><td><input id="cp_g_min_${i}" value="${esc(normalizeCareerGateMinimum(g.code,g.minimum))}"></td></tr>`;
}

function updateCareerWeightTotal(){
  const ids=['cp_w_comp','cp_w_sup','cp_w_kpi','cp_w_exp'];
  const total=ids.reduce((a,id)=>a+(Number(document.getElementById(id)?.value)||0),0);
  const el=document.getElementById('cp_weight_total');
  if(el){el.textContent=`Total bobot: ${total}%`;el.className=Math.abs(total-100)<0.001?'success':'error';}
}

function collectCareerPolicyUI(statusOverride){
  const gates=(CAREER_POLICY_UI?.gates||[]).map((g,i)=>({code:document.getElementById(`cp_g_code_${i}`)?.value.trim()||g.code,name:document.getElementById(`cp_g_name_${i}`)?.value.trim()||g.name,T1_T2:!!document.getElementById(`cp_g_t12_${i}`)?.checked,T2_T3:!!document.getElementById(`cp_g_t23_${i}`)?.checked,T3_T4:!!document.getElementById(`cp_g_t34_${i}`)?.checked,minimum:normalizeCareerGateMinimum(
  document.getElementById(`cp_g_code_${i}`)?.value.trim()||g.code,
  document.getElementById(`cp_g_min_${i}`)?.value.trim()||''
)}));
  return {academicYear:document.getElementById('cp_year').value.trim(),status:statusOverride||document.getElementById('cp_status').value,thresholds:{T1_T2:Number(document.getElementById('cp_t12').value),T2_T3:Number(document.getElementById('cp_t23').value),T3_T4:Number(document.getElementById('cp_t34').value)},minimumCompetency:{T1_T2:Number(document.getElementById('cp_m12').value),T2_T3:Number(document.getElementById('cp_m23').value),T3_T4:Number(document.getElementById('cp_m34').value)},weights:{competency:Number(document.getElementById('cp_w_comp').value),supervisor:Number(document.getElementById('cp_w_sup').value),kpi:Number(document.getElementById('cp_w_kpi').value),experience:Number(document.getElementById('cp_w_exp').value)},gates};
}

async function saveCareerPolicyUI(statusOverride){
  try{
    const d=collectCareerPolicyUI(statusOverride);
    if(!d.academicYear)throw new Error('Academic Year wajib diisi.');
    const total=d.weights.competency+d.weights.supervisor+d.weights.kpi+d.weights.experience;
    if(Math.abs(total-100)>0.001)throw new Error('Total bobot harus tepat 100%. Saat ini: '+total+'%.');
    CAREER_POLICY_UI=await call('saveCareerPolicyAdmin',TOKEN,d);
    CAREER_POLICIES_UI=await call('getCareerPoliciesAdmin',TOKEN);
    alert(`Career Progression Policy ${d.academicYear} berhasil disimpan dengan status ${CAREER_POLICY_UI.status}.`);
    renderCareerPolicy(CAREER_POLICY_UI);
  }catch(e){err(e)}
}

async function loadExperienceContributionVersionsUI(
  ay
){

  try{

    EXPERIENCE_CONTRIBUTION_AY =
      String(ay || '').trim();

    const select =
      document.getElementById(
        'ec_version_select'
      );

    if(!select) return;

    EXPERIENCE_CONTRIBUTION_VERSIONS_UI =
      await call(
        'getExperienceContributionVersionsAdmin',
        TOKEN
      );

    const versions =
      EXPERIENCE_CONTRIBUTION_VERSIONS_UI
        .filter(function(x){

          return x.academicYear ===
            EXPERIENCE_CONTRIBUTION_AY;

        });

    select.innerHTML =
      versions.length

        ? versions
            .sort(function(a,b){

              return b.version - a.version;

            })
            .map(function(x){

              return `
                <option value="${x.version}">
                  Version ${x.version}
                </option>
              `;

            })
            .join('')

        : `<option value="1">Version 1</option>`;

    const version =
      versions.length
        ? Math.max.apply(
            null,
            versions.map(function(x){
              return x.version;
            })
          )
        : 1;

    select.value =
      String(version);

    await loadExperienceContributionVersionUI();

  }catch(e){

    err(e);

  }

}

   ========================================================= */

function updateExperienceContributionWeightSummary(){

  const items =
    EXPERIENCE_CONTRIBUTION_UI || [];

  let total = 0;

  items.forEach(function(x,i){

    const active =
      document.getElementById(
        `ec_active_${i}`
      )?.checked;

    if(!active) return;

    total += Number(
      document.getElementById(
        `ec_weight_${i}`
      )?.value || 0
    );

  });

  const box =
    document.getElementById(
      'ec_total_warning'
    );

  if(!box) return;

  if(Math.abs(total - 100) < 0.001){

    box.innerHTML = `

      <div style="
        padding:10px;
        border-radius:8px;
        background:#ecfdf5;
        color:#166534;
      ">

        ✓ Total bobot aktif:
        <b>100%</b>

      </div>

    `;

  }else{

    box.innerHTML = `

      <div style="
        padding:10px;
        border-radius:8px;
        background:#fff7ed;
        color:#9a3412;
      ">

        ⚠ Total bobot aktif:
        <b>${total}%</b>

        — harus tepat <b>100%</b>.

      </div>

    `;

  }

}

async function saveExperienceContributionUI(){

  try{

    const data =
      collectExperienceContributionUI();

    if(!data.academicYear){

      throw new Error(
        'Academic Year wajib diisi.'
      );

    }

    if(!data.items.length){

      throw new Error(
        'Minimal harus ada satu indikator.'
      );

    }

    const active =
      data.items.filter(function(x){

        return x.active !== false;

      });

    const total =
      active.reduce(function(sum,x){

        return sum +
          Number(x.weight || 0);

      },0);

    if(Math.abs(total - 100) > 0.001){

      throw new Error(
        'Total bobot indikator aktif harus 100%. Saat ini ' +
        total +
        '%.'
      );

    }

    const result =
      await call(
        'saveExperienceContributionCriteriaAdmin',
        TOKEN,
        data
      );

    EXPERIENCE_CONTRIBUTION_UI =
      result;

    EXPERIENCE_CONTRIBUTION_AY =
      data.academicYear;

    EXPERIENCE_CONTRIBUTION_VERSIONS_UI =
      await call(
        'getExperienceContributionVersionsAdmin',
        TOKEN
      );

    const newestVersion =
      result.length
        ? result[0].version
        : 1;

    const select =
      document.getElementById(
        'ec_version_select'
      );

    if(select){

      select.innerHTML =
        EXPERIENCE_CONTRIBUTION_VERSIONS_UI
          .filter(function(x){

            return x.academicYear ===
              data.academicYear;

          })
          .sort(function(a,b){

            return b.version - a.version;

          })
          .map(function(x){

            return `
              <option value="${x.version}">
                Version ${x.version}
              </option>
            `;

          })
          .join('');

      select.value =
        String(newestVersion);

    }

    renderExperienceContributionEditor();

    alert(
      'Experience & Contribution berhasil disimpan sebagai Version ' +
      newestVersion +
      '.'
    );

  }catch(e){

    err(e);

  }

}

let READINESS_ADMIN = [];
let READINESS_AY = '';
let READINESS_VERSION = 1;


/* ---------- OPEN ADMIN PAGE ---------- */

async function showReadinessAdmin(){
  setAdminActive('readiness');

  try{

    // Ambil Career Policy aktif
    const policy = await call(
      'getActiveCareerPolicy',
      TOKEN
    );

    READINESS_AY = policy.academicYear || '2026-2027';

    // Ambil daftar version yang sudah ada
    const versions = await call(
      'getSupervisorReadinessVersionsAdmin',
      TOKEN
    );

    const ayVersions = versions.filter(
      x => String(x.academicYear) === String(READINESS_AY)
    );

    if(ayVersions.length){
      READINESS_VERSION = Math.max(
        ...ayVersions.map(x => Number(x.version))
      );
    }else{
      READINESS_VERSION = 1;
    }

    READINESS_ADMIN = await call(
      'getSupervisorReadinessCriteriaAdmin',
      TOKEN,
      READINESS_AY,
      READINESS_VERSION
    );

    renderReadinessAdmin();

  }catch(e){
    err(e);
  }
}

/* ---------- ADD CRITERION ---------- */

function addReadinessCriterion(){

  READINESS_ADMIN.push({

    academicYear: READINESS_AY,

    version: READINESS_VERSION,

    criterionId:
      'READ-' +
      String(READINESS_ADMIN.length + 1)
        .padStart(2,'0'),

    sortOrder:
      READINESS_ADMIN.length + 1,

    name:
      'Indikator Baru',

    focus:
      'Fokus penilaian indikator',

    weight:
      0,

    levels:[
      '',
      '',
      '',
      ''
    ],

    active:true

  });

  renderReadinessAdmin();

}


/* ---------- REMOVE / DEACTIVATE ---------- */

function removeReadinessCriterion(i){

  if(!READINESS_ADMIN[i]) return;

  READINESS_ADMIN[i].active = false;

  renderReadinessAdmin();

}


/* ---------- COLLECT FORM ---------- */

function collectReadinessCriteria(){

  document
    .querySelectorAll('[data-readiness-index]')
    .forEach(card => {

      const i =
        Number(
          card.dataset.readinessIndex
        );

      const x =
        READINESS_ADMIN[i];

      if(!x) return;


      x.criterionId =
        document
          .getElementById(`ra_id_${i}`)
          .value
          .trim();


      x.name =
        document
          .getElementById(`ra_name_${i}`)
          .value
          .trim();


      x.weight =
        Number(
          document
            .getElementById(`ra_weight_${i}`)
            .value || 0
        );


      x.active =
        document
          .getElementById(`ra_active_${i}`)
          .value === 'YES';


      x.focus =
        document
          .getElementById(`ra_focus_${i}`)
          .value;


      x.levels = [
        1,2,3,4
      ].map(level =>
        document
          .getElementById(
            `ra_level_${level}_${i}`
          )
          .value
      );

    });

  return READINESS_ADMIN;
}


/* ---------- SAVE NEW VERSION ---------- */

async function saveReadinessCriteria(){

  try{

    collectReadinessCriteria();


    const active =
      READINESS_ADMIN
        .filter(x => x.active !== false);


    const total =
      active.reduce(
        (sum,x) =>
          sum + Number(x.weight || 0),
        0
      );


    if(Math.abs(total - 100) > 0.001){

      throw new Error(
        `Total bobot indikator aktif harus 100%.
         Saat ini ${total.toFixed(2)}%.`
      );

    }


    if(!active.length){

      throw new Error(
        'Minimal harus ada satu indikator aktif.'
      );

    }


    READINESS_ADMIN =
      await call(
        'saveSupervisorReadinessCriteriaAdmin',
        TOKEN,
        {
          academicYear: READINESS_AY,
          items: READINESS_ADMIN
        }
      );


    READINESS_VERSION =
      READINESS_ADMIN[0]?.version ||
      READINESS_VERSION + 1;


    alert(
      `Supervisor Readiness berhasil disimpan sebagai Version ${READINESS_VERSION}.`
    );


    renderReadinessAdmin();


  }catch(e){

    err(e);

  }

}

/* ------------------------------------------------------------
   RENDER MAIN ASSESSMENT
------------------------------------------------------------ */

function renderExperienceContributionAssessment_(data){

  const loading =
    document.getElementById('expAssessmentLoading');

  const body =
    document.getElementById('expAssessmentBody');


  if(loading){
    loading.remove();
  }


  if(!body){
    return;
  }


  const criteria =
    Array.isArray(data?.criteria)
      ? data.criteria
      : [];


  const assessment =
    data?.assessment || {};


  if(!criteria.length){

    body.innerHTML = `

      <div class="error">

        Belum ada Experience & Contribution
        criteria aktif untuk Academic Year ini.

      </div>

    `;

    return;
  }


  const completed =
    criteria.filter(c => {

      const a =
        assessment[c.criterionId] || {};

      return [1,2,3,4].includes(
        Number(a.rating)
      );

    }).length;


  const totalWeight =
    criteria.reduce(
      (sum,c) =>
        sum + Number(c.weight || 0),
      0
    );


  body.innerHTML = `

    <div style="margin:18px 0">

      <div style="
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      ">

        <span class="badge">

          Academic Year:
          <b>
            ${escExp_(data.academicYear || '-')}
          </b>

        </span>


        <span class="badge">

          Version:
          <b>
            ${Number(data.version || 0)}
          </b>

        </span>


        <span class="badge">

          Progress:
          <b>
            ${completed}/${criteria.length}
          </b>

        </span>


        <span class="badge">

          Total Weight:
          <b>
            ${totalWeight}%
          </b>

        </span>

      </div>

    </div>


    <div class="success small">

      Sistem otomatis menggunakan
      <b>criteria version terbaru</b>.

      Histori version sebelumnya tetap tersimpan.

    </div>


    ${criteria.map((c,i) =>

      renderExperienceCriterion_(
        c,
        i,
        assessment[c.criterionId] || {}
      )

    ).join('')}


    <div style="
      margin-top:24px;
      padding-top:18px;
      border-top:1px solid #ddd;
    ">

      <button
        class="btn"
        onclick="saveExperienceContributionAssessmentUI()"
      >
        💾 Simpan Assessment
      </button>


      <button
        class="btn secondary"
        style="margin-left:6px"
        onclick="closeExperienceContributionAssessment()"
      >
        Batal / Kembali
      </button>


      <span
        id="expSaveStatus"
        class="muted small"
        style="margin-left:10px"
      ></span>

    </div>

  `;

}


/* ------------------------------------------------------------
   RENDER EACH CRITERION
------------------------------------------------------------ */

function renderExperienceCriterion_(c,i,a){

  const rating =
    Number(a.rating || 0);


  const levels =
    Array.isArray(c.levels)
      ? c.levels
      : [];


  return `

    <div
      class="comp"
      style="margin:16px 0"
    >

      <div style="
        display:flex;
        justify-content:space-between;
        gap:12px;
        flex-wrap:wrap;
      ">


        <div>

          <div class="small muted">

            <b>
              ${escExp_(c.criterionId)}
            </b>

          </div>


          <h3 style="margin:4px 0">

            ${escExp_(c.name)}

          </h3>


          <div class="small muted">

            ${escExp_(c.focus || '')}

          </div>

        </div>


        <span class="badge">

          Bobot
          ${Number(c.weight || 0)}%

        </span>

      </div>


      <div style="margin-top:16px">

        <label style="font-weight:700">

          Pilih Level

        </label>


        <div class="levelgrid">

          ${[1,2,3,4].map(level => `

            <div
              class="level
                ${rating === level ? 'selected' : ''}"
              id="exp_${i}_${level}"
              onclick="
                selectExpLevel_(${i},${level})
              "
            >

              <strong>

                Level ${level}

              </strong>


              <span class="small">

                ${escExp_(
                  levels[level-1] || '-'
                )}

              </span>

            </div>

          `).join('')}

        </div>


        <input
          type="hidden"
          id="exp_rating_${i}"
          value="${rating || ''}"
        >

      </div>


      <div
        class="field"
        style="margin-top:14px"
      >

        <label>

          Evidence / Bukti

        </label>


        <textarea
          id="exp_evidence_${i}"
          rows="3"
          placeholder="
            Tuliskan bukti atau contoh nyata
            yang mendukung level yang dipilih...
          "
        >${escExp_(a.evidence || '')}</textarea>

      </div>


      <div class="field">

        <label>

          Comment / Catatan Assessor

        </label>


        <textarea
          id="exp_comment_${i}"
          rows="3"
          placeholder="
            Tuliskan catatan assessor...
          "
        >${escExp_(a.comment || '')}</textarea>

      </div>

    </div>

  `;

}


/* ------------------------------------------------------------
   SELECT LEVEL
------------------------------------------------------------ */

function selectExpLevel_(i,level){

  for(let k=1;k<=4;k++){

    const el =
      document.getElementById(
        `exp_${i}_${k}`
      );

    if(el){

      el.classList.remove(
        'selected'
      );

    }

  }


  const selected =
    document.getElementById(
      `exp_${i}_${level}`
    );


  if(selected){

    selected.classList.add(
      'selected'
    );

  }


  const input =
    document.getElementById(
      `exp_rating_${i}`
    );


  if(input){

    input.value = level;

  }

}

/* ------------------------------------------------------------
   ESCAPE HTML
------------------------------------------------------------ */

function escExp_(v){

  return String(
    v == null ? '' : v
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

async function loadExperienceContributionAssessmentForTeacher(){
  try{
    const username = (document.getElementById('eca_teacher')?.value || '').trim().toLowerCase();

      return;
    }

    const result = await call('getExperienceContributionAssessment', TOKEN, username);

    EC_ASSESSMENT_CRITERIA = result.criteria || [];
    EC_ASSESSMENT_AY = result.academicYear || EC_ASSESSMENT_AY;
    EC_ASSESSMENT_VERSION = result.version || EC_ASSESSMENT_VERSION;

    // ubah map assessment -> array supaya cocok dengan renderer yang ada
    const a = result.assessment || {};
    EC_ASSESSMENT_CURRENT = {
      criteria: Object.keys(a).map(id => Object.assign({criterionId: id}, a[id]))
    };

  }

async function saveExperienceContributionAssessmentUI(){
  try{
    const username = (document.getElementById('eca_teacher')?.value || '').trim().toLowerCase();
    if(!username) throw new Error('Teacher belum dipilih.');

    const criteria = (EC_ASSESSMENT_CRITERIA || []).filter(c => c.active !== false);
    if(!criteria.length) throw new Error('Criteria belum dimuat.');

    const items = criteria.map((c,i) => {
      const sel = document.querySelector(`input[name="eca_rating_${i}"]:checked`);
      const rating = sel ? Number(sel.value) : 0;
      if(![1,2,3,4].includes(rating))
        throw new Error(`Rating ${c.criterionId} — ${c.name} belum dipilih.`);
      return {
        criterionId: String(c.criterionId),
        rating: rating,
        evidence: document.getElementById(`eca_evidence_${i}`)?.value.trim() || '',
        comment: document.getElementById(`eca_comment_${i}`)?.value.trim() || ''
      };
    });

    const st = document.getElementById('eca_save_status');
    if(st) st.textContent = 'Menyimpan...';

    await call('saveExperienceContributionAssessment', TOKEN, username, items);

    if(st) st.textContent = 'Tersimpan ✓';
    alert('Assessment Experience & Contribution berhasil disimpan.');
    await loadExperienceContributionAssessmentForTeacher();
  }catch(e){
    err(e);
  }
}

/* Ganti tabel "Score Components" sesuai bobot policy; bobot 0% disembunyikan */
function fixScoreTable_(cp, root){
  if(!cp || !cp.components) return;
  const c = cp.components, w = c.weights || {};
  const hasW = Object.keys(w).length > 0;
  const fmt = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? '-' : Number(v).toFixed(2);
  const rows = [
    ['Competency Assessment', c.competency, w.competency],
    ['Supervisor Readiness', c.supervisor, w.supervisor],
    ['KPI / Performance', c.kpi, w.kpi],
    ['Experience & Contribution', c.experienceContribution, w.experience]
  ].filter(r => !hasW || Number(r[2]) > 0);

  const scope = root || document;
  const h = Array.from(scope.querySelectorAll('h3'))
    .find(x => x.textContent.trim() === 'Score Components');
  const table = h && h.nextElementSibling;
  if(!table || table.tagName !== 'TABLE') return;

  table.innerHTML = '<tr><th>Component</th><th>Score</th><th>Weight</th></tr>' +
    rows.map(r => `<tr><td>${esc(r[0])}</td><td>${fmt(r[1])}</td><td>${Number(r[2]||0)}%</td></tr>`).join('');
}

/* ---------- Helper ---------- */
function dxRing_(pct, color, label, sub, centerText){
  const r = 40, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
  return `<div class="dx-ring">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#eef1f6" stroke-width="10"/>
      <circle class="fg" cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}"
        transform="rotate(-90 50 50)"/>
      <text x="50" y="55" text-anchor="middle" font-size="18" font-weight="800" fill="#17324d">${esc(centerText)}</text>
    </svg>
    <div class="lbl">${esc(label)}</div><div class="sub">${esc(sub)}</div></div>`;
}

function dxStatus_(i){
  const v = Number(i.validatedLevel||0), t = Number(i.target||0);
  if(v <= 0) return {k:'na', label:'Belum dinilai'};
  if(v >= t) return {k:'ok', label:'Tercapai'};
  return {k:'gap', label:'Perlu dikembangkan'};
}

function dxRadar_(items){
  const order = ['Pedagogik','Profesional','Kepribadian','Sosial','Global & Internasional'];
  const cl = order.filter(c => items.some(i => i.cluster === c));
  if(cl.length < 3) return '<p class="muted small">Data belum cukup untuk radar chart.</p>';
  const cx = 160, cy = 150, R = 105, n = cl.length;
  const avg = (arr, f) => arr.length ? arr.reduce((s,x)=>s+Number(f(x)||0),0)/arr.length : 0;
  const data = cl.map(c => {
    const g = items.filter(i => i.cluster === c);
    return {c, val: avg(g, i => i.validatedLevel), tgt: avg(g, i => i.target)};
  });
  const pt = (i, v) => {
    const a = (-90 + i*360/n) * Math.PI/180, r = R * v/4;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  const poly = k => data.map((d,i)=>pt(i,d[k]).map(x=>x.toFixed(1)).join(',')).join(' ');
  const grid = [1,2,3,4].map(l =>
    `<polygon points="${data.map((d,i)=>pt(i,l).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`).join('');
  const axes = data.map((d,i)=>{const p=pt(i,4);return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#e5e7eb"/>`}).join('');
  const labels = data.map((d,i)=>{
    const p = pt(i,4.75), anchor = p[0] < cx-8 ? 'end' : (p[0] > cx+8 ? 'start' : 'middle');
    const short = d.c === 'Global & Internasional' ? 'Global' : d.c;
    return `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#344054">${esc(short)}</text>`;
  }).join('');
  const dots = (k,col) => data.map((d,i)=>{
    const p = pt(i,d[k]);
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="${col}" stroke="#fff" stroke-width="2">
      <title>${esc(d.c)} — ${k==='val'?'Nilai':'Target'}: ${d[k].toFixed(2)}</title></circle>`;
  }).join('');
  return `<svg viewBox="0 0 320 300" style="width:100%;max-width:420px;display:block;margin:0 auto">
    ${grid}${axes}
    <polygon points="${poly('tgt')}" fill="rgba(23,50,77,.08)" stroke="#17324d" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="${poly('val')}" fill="rgba(37,99,235,.25)" stroke="#2563eb" stroke-width="2.5"/>
    ${dots('tgt','#17324d')}${dots('val','#2563eb')}${labels}
  </svg>
  <div class="dx-legend"><span><i style="background:#2563eb"></i>Level Anda</span><span><i style="background:#17324d"></i>Target</span></div>`;
}

function dxPath_(level){
  const lv = ['T1','T2','T3','T4'], idx = lv.indexOf(level);
  const names = ['Foundation','Developing','Experienced','Expert'];
  return `<div class="dx-path">` + lv.map((l,i)=>{
    const cls = i < idx ? 'done' : (i === idx ? 'now' : '');
    return `<div class="dx-step ${cls}"><div class="dx-dot">${i<idx?'✓':l}</div><div class="t">${l} • ${names[i]}</div></div>` +
      (i < lv.length-1 ? `<div class="dx-line ${i<idx?'done':''}"></div>` : '');
  }).join('') + `</div>`;
}

function dxListHTML_(items){
  const f = DASH_FILTER;
  let list = items.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  if(f.cluster !== 'ALL') list = list.filter(i => i.cluster === f.cluster);
  if(f.mode === 'GAP') list = list.filter(i => dxStatus_(i).k === 'gap');
  if(f.mode === 'OK') list = list.filter(i => dxStatus_(i).k === 'ok');

  const clusters = ['ALL'].concat(Array.from(new Set(items.map(i=>i.cluster))));
  const modes = [['ALL','Semua'],['GAP','Perlu dikembangkan'],['OK','Tercapai']];

  const chips = `<div class="dx-chips">${clusters.map(c =>
      `<button class="dx-chip ${f.cluster===c?'on':''}" onclick="dxSetCluster('${esc(c)}')">${c==='ALL'?'Semua Cluster':esc(c)}</button>`).join('')}</div>
    <div class="dx-chips">${modes.map(m =>
      `<button class="dx-chip ${f.mode===m[0]?'on':''}" onclick="dxSetMode('${m[0]}')">${m[1]}</button>`).join('')}</div>`;

  const rows = list.map(i => {
    const st = dxStatus_(i), col = DASH_CLUSTER_COLORS[i.cluster] || '#2563eb';
    const v = Number(i.validatedLevel||0), s = Number(i.selfLevel||0), t = Number(i.target||0);
    const open = !!DASH_OPEN[i.code];
    const lvDesc = (i.levels && v>0) ? i.levels[v-1] : '';
    const detail = open ? `<div class="dx-detail">
        <div><b>Level Anda:</b> ${v?('Level '+v+' — '+DASH_LEVELS[v-1]):'-'} &nbsp;•&nbsp; <b>Self:</b> ${s||'-'} &nbsp;•&nbsp; <b>Supervisor:</b> ${i.supLevel||'-'} &nbsp;•&nbsp; <b>Target:</b> ${t||'-'}</div>
        ${lvDesc?`<div style="margin-top:6px"><b>Deskripsi level:</b> ${esc(lvDesc)}</div>`:''}
        ${i.selfEvidence?`<div style="margin-top:6px"><b>Bukti Anda:</b> ${esc(i.selfEvidence)}</div>`:''}
        ${i.selfReflection?`<div style="margin-top:6px"><b>Refleksi Anda:</b> ${esc(i.selfReflection)}</div>`:''}
        ${i.supComment?`<div style="margin-top:6px"><b>Komentar Supervisor:</b> ${esc(i.supComment)}</div>`:''}
        ${i.validationStatus==='PROVISIONAL'?'<div style="margin-top:6px" class="muted">Status sementara (belum divalidasi Supervisor).</div>':''}
      </div>` : '';
    return `<div class="dx-row" onclick="dxToggle('${esc(i.code)}')">
      <div class="dx-head">
        <div><span class="dx-code" style="background:${col}">${esc(i.code)}</span><span class="dx-name">${esc(i.name)}</span></div>
        <span class="dx-st ${st.k}">${st.label}</span>
      </div>
      <div class="dx-track">
        <div class="dx-self" style="width:${s/4*100}%"></div>
        <div class="dx-val" style="width:${v/4*100}%;background:${col}"></div>
        <div class="dx-tgt" style="left:calc(${t/4*100}% - 1px)"></div>
      </div>
      <div class="dx-scale"><span>L1</span><span>L2</span><span>L3</span><span>L4</span></div>
      ${detail}
    </div>`;
  }).join('') || '<p class="muted">Tidak ada kompetensi pada filter ini.</p>';

  return chips + `<div class="dx-legend" style="justify-content:flex-start"><span><i style="background:#c7d7fb"></i>Self</span><span><i style="background:#2563eb"></i>Tervalidasi</span><span>🎯 Target</span></div>` + rows;
}

function dxRefresh_(){
  const el = document.getElementById('dxList');
  if(el && DATA) el.innerHTML = dxListHTML_(DATA.items || []);
}
function dxSetCluster(c){ DASH_FILTER.cluster = c; dxRefresh_(); }
function dxSetMode(m){ DASH_FILTER.mode = m; dxRefresh_(); }
function dxToggle(code){ DASH_OPEN[code] = !DASH_OPEN[code]; dxRefresh_(); }

/* ---------- Muat & filter ---------- */
async function showTeamDashboard(){
  if(hasRole('ADMIN')) setAdminActive('dashboard'); else setTeacherActive('team');
  document.getElementById('page').innerHTML = '<div class="card"><p class="muted">Memuat rekap tim...</p></div>';
  try{
    TEAM = await call('getTeamOverview', TOKEN);
    TEAM_C = {};
    TEAM.competencies.forEach(c => TEAM_C[c.code] = c);
    TEAM.teachers.forEach(t => { t.im = {}; t.items.forEach(i => t.im[i.c] = i); });
    TEAM_NEED_OPEN = '';
    renderTeam_();
  }catch(e){ err(e); }
}

function tmAttn_(t){ return t.gapCount*2 + (t.total - t.assessed); }

function tmFiltered_(){
  const f = TEAM_F, q = f.q.trim().toLowerCase();
  const L = (TEAM.teachers||[]).filter(t =>
    (f.sup==='ALL' || t.supervisor===f.sup) &&
    (f.level==='ALL' || t.careerLevel===f.level) &&
    (!q || (t.name+' '+t.username).toLowerCase().includes(q)));
  const cmp = {
    name:(a,b)=>a.name.localeCompare(b.name),
    attn:(a,b)=>tmAttn_(b)-tmAttn_(a),
    score:(a,b)=>(b.score===null?-1:b.score)-(a.score===null?-1:a.score)
  }[f.sort];
  return L.sort(cmp);
}

function tmSearch(v){ TEAM_F.q = v; tmBody_(); }
function tmSetF(k,v){ TEAM_F[k] = v; tmChips_(); tmBody_(); }

function renderTeam_(){
  const admin = hasRole('ADMIN');
  const supSel = admin && TEAM.supervisors.length > 1 ? `
    <select onchange="tmSetF('sup',this.value)" style="padding:10px;border:1px solid #ccd3df;border-radius:8px">
      <option value="ALL">Semua supervisor</option>
      ${TEAM.supervisors.map(s=>`<option value="${esc(s.username)}" ${TEAM_F.sup===s.username?'selected':''}>${esc(s.name)}</option>`).join('')}
    </select>` : '';

  document.getElementById('page').innerHTML = `

      </div>

function tmChips_(){
  const lv = ['ALL','T1','T2','T3','T4'];

}

/* ---------- Helper grafik ---------- */
function tmDonut_(segs){
  const tot = segs.reduce((s,x)=>s+x.v,0), r = 40, c = 2*Math.PI*r; let acc = 0;
  const arcs = segs.filter(x=>x.v>0).map(x=>{
    const len = c*x.v/tot;
    const a = `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${x.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}"
      transform="rotate(-90 50 50)"><title>${esc(x.label)}: ${x.v}</title></circle>`;
    acc += len; return a;
  }).join('');
  return `<svg viewBox="0 0 100 100" style="width:130px;height:130px">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#eef1f6" stroke-width="14"/>${arcs}
    <text x="50" y="56" text-anchor="middle" font-size="20" font-weight="800" fill="#17324d">${tot}</text></svg>`;
}

function tmNeeds_(L){
  const m = {};
  L.forEach(t => t.items.forEach(i => {
    if(i.v > 0 && i.g > 0){
      const o = m[i.c] || (m[i.c] = {c:i.c, list:[], idp:0, sumG:0});
      o.list.push({n:t.name, u:t.username, g:i.g});
      o.sumG += i.g;
      if(t.idpCodes.includes(i.c)) o.idp++;
    }
  }));
  return Object.values(m).map(o => Object.assign(o,{avg:o.sumG/o.list.length}))
    .sort((a,b)=>b.list.length-a.list.length || b.avg-a.avg);
}

function tmFit_(tr, v){
  return (tr.min===''||v>=tr.min) && (tr.max===''||v<=tr.max);
}

/* ---------- Isi utama ---------- */
function tmBody_(){
  const box = document.getElementById('tmBody'); if(!box) return;
  const L = tmFiltered_();
  if(!L.length){ box.innerHTML = '<div class="dx-card"><p class="muted">Tidak ada guru pada filter ini.</p></div>'; return; }

  const sum = (a,f)=>a.reduce((s,x)=>s+f(x),0);
  const totalItems = sum(L,t=>t.total);
  const selfPct = totalItems ? Math.round(sum(L,t=>t.selfCount)/totalItems*100) : 0;
  const supPct  = totalItems ? Math.round(sum(L,t=>t.supCount)/totalItems*100) : 0;
  const scores = L.filter(t=>t.score!==null).map(t=>t.score);
  const avgScore = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null;
  const needIdp = L.filter(t=>t.gapCount>0);
  const idpPct = needIdp.length ? Math.round(needIdp.filter(t=>t.idpCodes.length>0).length/needIdp.length*100) : 100;

  const rings = `<div class="dx-rings">
    ${dxRing_(avgScore===null?0:Math.round(avgScore),'#2563eb','Rata-rata Skor',L.length+' guru',avgScore===null?'-':Math.round(avgScore)+'%')}
    ${dxRing_(selfPct,'#0d9488','Self Assessment','terisi',selfPct+'%')}
    ${dxRing_(supPct,'#7c3aed','Supervisor','tervalidasi',supPct+'%')}
    ${dxRing_(idpPct,'#ea580c','Cakupan IDP','guru bergap punya IDP',idpPct+'%')}
  </div>`;

  /* distribusi level */
  const lvColors = {T1:'#60a5fa',T2:'#34d399',T3:'#fbbf24',T4:'#f472b6'};
  const lvCount = {T1:0,T2:0,T3:0,T4:0}; L.forEach(t=>{ if(lvCount[t.careerLevel]!==undefined) lvCount[t.careerLevel]++; });
  const lvMax = Math.max(1,...Object.values(lvCount));
  const lvHTML = Object.keys(lvCount).map(k=>`
    <div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <b style="width:28px">${k}</b>
      <div class="tm-bar" style="flex:1;height:16px"><i style="width:${lvCount[k]/lvMax*100}%;background:${lvColors[k]}"></i></div>
      <span class="small" style="width:60px">${lvCount[k]} guru</span></div>`).join('');

  /* donut profil */
  const pc = {}; L.forEach(t=>pc[t.profile]=(pc[t.profile]||0)+1);
  const segs = Object.keys(TM_PROFILE).map(k=>({v:pc[k]||0,color:TM_PROFILE[k][1],label:TM_PROFILE[k][0]}));
  const donut = `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${tmDonut_(segs)}
    <div>${segs.map(s=>`<div class="small" style="margin:4px 0"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.color};margin-right:6px"></i>${esc(s.label)}: <b>${s.v}</b></div>`).join('')}</div></div>`;

  /* cluster */
  const cl = {};
  L.forEach(t=>t.items.forEach(i=>{ if(i.v>0){ const k=(TEAM_C[i.c]||{}).cluster||'-'; (cl[k]=cl[k]||{s:0,n:0}); cl[k].s+=Math.min(1,i.v/i.t); cl[k].n++; } }));
  const clHTML = Object.keys(cl).map(k=>{ const p=Math.round(cl[k].s/cl[k].n*100); return `
    <div style="margin:9px 0"><div class="small" style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span>${p}%</span></div>
    <div class="tm-bar"><i style="width:${p}%;background:${TM_COLORS[k]||'#2563eb'}"></i></div></div>`; }).join('') || '<p class="muted small">Belum ada data.</p>';

  /* heatmap */
  const codeSet = {}; L.forEach(t=>t.items.forEach(i=>codeSet[i.c]=true));
  const cols = TEAM.competencies.filter(c=>codeSet[c.code]);
  const cellHTML = (t,code)=>{
    const i = t.im[code];
    if(!i) return `<td><div class="tm-c no"></div></td>`;
    const tip = `${t.name} — ${code}: level ${i.v||'-'} / target ${i.t} (self ${i.s||'-'}, supervisor ${i.u||'-'})`;
    let cls = '', bg = '', txt = i.v;
    if(i.v===0){ cls='na'; txt='·'; }
    else if(i.g===0) bg='#16834b';
    else if(i.g===1) bg='#f59e0b';
    else bg='#dc2626';
    return `<td><div class="tm-c ${cls}" style="${bg?'background:'+bg:''}" title="${esc(tip)}" onclick="tmDetail('${esc(t.username)}')">${txt}</div></td>`;
  };
  const heat = `<div class="tm-hmwrap"><table class="tm-hm">
    <tr><th></th>${cols.map(c=>`<th class="col" title="${esc(c.name)}" onclick="tmNeedOpen('${esc(c.code)}')"><span>${esc(c.code)}</span></th>`).join('')}</tr>
    ${L.map(t=>`<tr><td class="nm" onclick="tmDetail('${esc(t.username)}')">${esc(t.name)} <span class="small muted">${esc(t.careerLevel)}</span></td>${cols.map(c=>cellHTML(t,c.code)).join('')}</tr>`).join('')}
    <tr><td class="nm" style="cursor:default">Guru bergap</td>${cols.map(c=>{
      const n = L.filter(t=>{const i=t.im[c.code];return i&&i.v>0&&i.g>0;}).length;
      return `<td><div style="text-align:center;font-weight:800;color:${n?'#b42318':'#98a2b3'}">${n||'·'}</div></td>`; }).join('')}</tr>
  </table></div>
  <div class="dx-legend" style="justify-content:flex-start;margin-top:10px">
    <span><i style="background:#16834b"></i>Target tercapai</span><span><i style="background:#f59e0b"></i>Gap 1</span>
    <span><i style="background:#dc2626"></i>Gap ≥ 2</span><span><i style="background:#e5e7eb"></i>Belum dinilai</span>
    <span>Angka = level tervalidasi</span></div>`;

  /* kebutuhan & rekomendasi */
  const needs = tmNeeds_(L);
  const needHTML = needs.length ? needs.map(o=>{
    const info = TEAM_C[o.c] || {name:o.c,cluster:''}, col = TM_COLORS[info.cluster]||'#2563eb';
    const open = TEAM_NEED_OPEN === o.c, pct = o.list.length/L.length*100;
    const trs = TEAM.training[o.c] || [];
    const detail = open ? `
      <div style="margin-top:10px">
        <div class="small muted" style="margin-bottom:4px">Guru yang perlu dikembangkan (klik untuk detail):</div>
        ${o.list.map(x=>`<span class="tm-t" onclick="tmDetail('${esc(x.u)}')">${esc(x.n)} • gap ${x.g}</span>`).join('')}
        <div class="small muted" style="margin:10px 0 4px">Rekomendasi training:</div>
        ${trs.length ? trs.map(t=>`<div class="tm-tr">📚 <b>${esc(t.n)}</b><br><span class="small muted">${esc(t.type)} • ${esc(t.mode)} • ${esc(t.dur)}</span></div>`).join('')
          : `<div class="tm-tr muted">Belum ada training terpetakan. Tambahkan di sheet Training (CompetencyCode = ${esc(o.c)}).</div>`}
        ${o.list.length>=3?`<div class="tm-sug">💡 ${o.list.length} guru memiliki gap yang sama. Pertimbangkan <b>pelatihan kelompok / in-house</b> atau sesi PLC untuk kompetensi ini.</div>`:''}
        ${o.idp<o.list.length?`<div class="tm-sug">📝 ${o.list.length-o.idp} guru belum memiliki IDP aktif untuk kompetensi ini.</div>`:''}
      </div>` : '';
    return `<div class="tm-need">
      <div class="hd" onclick="tmNeedOpen('${esc(o.c)}')">
        <div><span class="dx-code" style="background:${col}">${esc(o.c)}</span><span class="dx-name">${esc(info.name)}</span></div>
        <div class="small"><b>${o.list.length}</b> guru • rata-rata gap <b>${o.avg.toFixed(1)}</b> • IDP <b>${o.idp}/${o.list.length}</b></div>
      </div>
      <div class="tm-bar" style="margin-top:8px"><i style="width:${pct}%;background:${col}"></i></div>
      ${detail}</div>`;
  }).join('') : '<p class="muted">Tidak ada gap yang teridentifikasi pada guru yang sudah dinilai. 🎉</p>';

  /* progress per guru */
  const prog = L.map(t=>{
    const p = TM_PROFILE[t.profile] || TM_PROFILE['BELUM DINILAI'];
    const sp = t.total?Math.round(t.selfCount/t.total*100):0, up = t.total?Math.round(t.supCount/t.total*100):0;
    const idp = t.idpCodes.length ? `<span class="tm-b" style="background:#ecfdf3;color:#137a43">IDP aktif ${t.idpCodes.length}</span>`
      : (t.gapCount>0 ? `<span class="tm-b" style="background:#fff7ed;color:#c56b08">⚠ Belum ada IDP</span>` : '');
    return `<div class="dx-row" onclick="tmDetail('${esc(t.username)}')"><div class="tm-prog">
      <div><div class="dx-name">${esc(t.name)}</div>
        <div class="small muted">${esc(t.careerLevel)}${t.subject?' • '+esc(t.subject):''}${hasRole('ADMIN')&&t.supervisorName?' • Sup: '+esc(t.supervisorName):''}</div></div>
      <div><div class="small">Self ${t.selfCount}/${t.total}</div><div class="tm-bar"><i style="width:${sp}%;background:#0d9488"></i></div></div>
      <div><div class="small">Supervisor ${t.supCount}/${t.total}</div><div class="tm-bar"><i style="width:${up}%;background:#7c3aed"></i></div></div>
      <div style="text-align:center"><b style="font-size:18px;color:#17324d">${t.score===null?'-':Math.round(t.score)}</b><div class="small muted">skor</div></div>
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">
        <span class="tm-b" style="background:${p[2]};color:${p[1]}">${p[0]}</span>${idp}</div>
    </div></div>`;
  }).join('');

  box.innerHTML = `
    ${rings}
    <div class="tm-3">
      <div class="dx-card"><h3>👥 Distribusi Career Level</h3>${lvHTML}</div>
      <div class="dx-card"><h3>🎯 Profil Guru</h3>${donut}</div>
      <div class="dx-card"><h3>🧩 Rata-rata per Cluster</h3>${clHTML}</div>
    </div>
    <div class="dx-card" style="margin-bottom:16px"><h3>🗺️ Peta Kompetensi Guru</h3>
      <p class="small muted" style="margin-top:0">Klik nama guru atau sel untuk detail. Klik kode kompetensi di header untuk melihat kebutuhannya.</p>${heat}</div>
    <div class="dx-card" style="margin-bottom:16px" id="tmNeeds"><h3>🚀 Kebutuhan Pengembangan & Rekomendasi Training</h3>
      <p class="small muted" style="margin-top:0">Diurutkan dari kompetensi yang paling banyak guru bergap. Klik untuk membuka.</p>${needHTML}</div>
    <div class="dx-card"><h3>📈 Progress per Guru</h3>${prog}</div>`;
}

      ${dxRing_(pct(t.supCount),'#7c3aed','Supervisor',t.supCount+' / '+n,pct(t.supCount)+'%')}

      ${dxRing_(t.score===null?0:Math.round(t.score),'#2563eb','Skor Kompetensi','terhadap target',t.score===null?'-':Math.round(t.score)+'%')}
    </div>
    <div class="dx-card" style="margin-bottom:16px"><h3>🧭 Jalur Karier</h3>${dxPath_(t.careerLevel)}</div>
    <div class="dx-two">

tmFiltered_ = function(){

    (f.sup === 'ALL' || t.supervisor === f.sup) &&

    (f.subject === 'ALL' || String(t.subject || '').trim() === f.subject) &&

    (!q || (t.name + ' ' + t.username).toLowerCase().includes(q)));
  const cmp = {
    name:  (a,b) => a.name.localeCompare(b.name),
    attn:  (a,b) => tmAttn_(b) - tmAttn_(a),
    score: (a,b) => (b.score === null ? -1 : b.score) - (a.score === null ? -1 : a.score)
  }[f.sort] || ((a,b) => a.name.localeCompare(b.name));

};

/* ---------- Ekspor CSV (pemisah titik koma, desimal koma, cocok untuk Excel Indonesia) ---------- */
function tmxNum_(v, d){
  return (v === null || v === undefined || isNaN(v)) ? '' : Number(v).toFixed(d).replace('.', ',');
}
function tmxCsv_(rows){
  return '\ufeff' + rows.map(r => r.map(v => {
    v = (v === null || v === undefined) ? '' : String(v);
    return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(';')).join('\r\n');
}
function tmxDownload_(name, text){
  const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function tmxStamp_(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function tmxExport(kind){
  try{
    const L = tmFiltered_();
    if(!L.length) throw new Error('Tidak ada guru pada filter ini.');
    let rows = [], name = '';

    if(kind === 'teachers'){
      name = 'TGD_Rekap_Guru';
      rows.push(['Nama','Username','Career Level','Mata Pelajaran','Departemen','Supervisor',
        'Kompetensi Dipetakan','Self Terisi','Supervisor Terisi','Sudah Dinilai','Target Tercapai',
        'Jumlah Gap','Skor Kompetensi (%)','Profil','IDP Aktif','Kode IDP Aktif']);
      L.forEach(t => rows.push([t.name, t.username, t.careerLevel, t.subject, t.department,
        t.supervisorName, t.total, t.selfCount, t.supCount, t.assessed, t.achieved, t.gapCount,
        tmxNum_(t.score, 1), (TM_PROFILE[t.profile] || [t.profile])[0],
        t.idpCodes.length, t.idpCodes.join(' ')]));

    }else if(kind === 'map'){
      name = 'TGD_Peta_Kompetensi';
      const present = {}; L.forEach(t => t.items.forEach(i => present[i.c] = true));
      const cols = TEAM.competencies.filter(c => present[c.code]);
      rows.push(['Nama','Username','Career Level'].concat(cols.map(c => c.code), ['Jumlah Gap']));
      L.forEach(t => rows.push([t.name, t.username, t.careerLevel].concat(
        cols.map(c => {
          const i = t.im[c.code];
          return i ? (i.v > 0 ? i.v : '-') + ' dari ' + i.t : '';
        }), [t.gapCount])));

    }else{
      name = 'TGD_Kebutuhan_Training';
      rows.push(['Kode','Kompetensi','Cluster','Jumlah Guru Bergap','Rata-rata Gap','IDP Aktif',
        'Guru yang Perlu Dikembangkan','Rekomendasi Training','Saran']);
      tmNeeds_(L).forEach(o => {
        const info = TEAM_C[o.c] || {name:o.c, cluster:''};
        const trs = (TEAM.training[o.c] || []).map(t =>
          t.n + ' [' + [t.type, t.mode, t.dur].filter(Boolean).join(', ') + ']').join(' | ');
        const saran = [];
        saran.push(o.list.length >= 3 ? 'Pelatihan kelompok / in-house' : 'Pengembangan individual');
        if(o.idp < o.list.length) saran.push((o.list.length - o.idp) + ' guru belum punya IDP');
        rows.push([o.c, info.name, info.cluster, o.list.length, tmxNum_(o.avg, 1),
          o.idp + '/' + o.list.length,
          o.list.map(x => x.n + ' (gap ' + x.g + ')').join(' | '),
          trs || 'Belum ada training terpetakan', saran.join('; ')]);
      });
    }
    tmxDownload_(name + '_' + tmxStamp_() + '.csv', tmxCsv_(rows));
  }catch(e){ err(e); }
}
